params:
  seed: -1

  algo:
    name: fpo

  model:
    name: fpo

  network:
    name: fpo
    separate: True

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.9
        fixed_sigma: True
        learn_sigma: False

    mlp:
      units: [1024, 512, 512]
      activation: relu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  # load_checkpoint: True
  load_checkpoint: False

  config:
    name: FPO
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    reward_shaper:
      scale_value: 1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.97
    learning_rate: 1e-4
    lr_schedule: constant
    score_to_win: 20000
    max_epochs: 50000 #100000
    save_best_after: 50
    save_frequency: 50
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: False
    ppo: True
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 16384 #32768 #65536 #61440 #4096 #
    mini_epochs: 6
    critic_coef: 1.2
    clip_value: False
    seq_len: 4
    bounds_loss_coef: 10
    enable_eps_greedy: False #Z0 #set as True in ase
    resume_from: None

    # device: "cpu" #ZT9
